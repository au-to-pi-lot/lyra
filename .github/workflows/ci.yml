name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (CMake)
            os: ubuntu-latest
            build: cmake
          - name: Linux (Makefile)
            os: ubuntu-latest
            build: make
          - name: Windows (CMake, MSVC)
            os: windows-latest
            build: cmake

    env:
      # vcpkg builds every dependency from source. Its binary cache stores the
      # built packages as zips; we persist that directory with actions/cache so
      # warm runs just unpack them instead of recompiling.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vcpkg cache
        id: vcpkg-key
        shell: bash
        run: |
          mkdir -p .vcpkg-binary-cache
          echo "vcpkg-sha=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg-key.outputs.vcpkg-sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.vcpkg-key.outputs.vcpkg-sha }}-
            vcpkg-${{ runner.os }}-

      # --- CMake (Linux and Windows) ---
      # The first configure bootstraps vcpkg from the submodule and installs
      # the manifest's dependencies. On Windows, CMake picks the newest Visual
      # Studio generator installed on the runner.
      - name: Configure (CMake)
        if: matrix.build == 'cmake'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -A x64
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          fi

      - name: Build (CMake)
        if: matrix.build == 'cmake'
        run: cmake --build build --config Debug --parallel

      - name: Test (CMake)
        if: matrix.build == 'cmake'
        run: ctest --test-dir build -C Debug --output-on-failure

      # --- Makefile (Linux) ---
      - name: Install dependencies (Makefile)
        if: matrix.build == 'make'
        run: make install

      - name: Build (Makefile)
        if: matrix.build == 'make'
        run: make -j"$(nproc)"

      - name: Test (Makefile)
        if: matrix.build == 'make'
        run: make test
